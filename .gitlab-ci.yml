stages:
  - test
  - build
  - deploy


# =========================
# TEST JOB
# =========================
test-job:
  stage: test
  image: node:18

  script:
    - echo "Starting TEST stage..."
    - cd backend
    - echo "Installing dependencies..."
    - npm ci
    - echo "TEST STAGE COMPLETED."

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# =========================
# BUILD JOB
# =========================
build-job:
  stage: build
  image: docker:latest

  services:
    - docker:dind

  before_script:
    - echo "Logging into Docker Hub..."
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  script:
    - echo "Starting BUILD stage..."

    - echo "Building Docker image..."
    - docker build -t $DOCKER_USERNAME/chat-app-backend:$CI_COMMIT_SHORT_SHA ./backend

    - echo "Tagging image as latest..."
    - docker tag $DOCKER_USERNAME/chat-app-backend:$CI_COMMIT_SHORT_SHA $DOCKER_USERNAME/chat-app-backend:latest

    - echo "Pushing versioned image..."
    - docker push $DOCKER_USERNAME/chat-app-backend:$CI_COMMIT_SHORT_SHA

    - echo "Pushing latest image..."
    - docker push $DOCKER_USERNAME/chat-app-backend:latest

    - echo "BUILD STAGE COMPLETED."

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# =========================
# DEPLOY JOB
# =========================
deploy-job:
  stage: deploy
  image: alpine:latest

  before_script:
    - echo "Installing SSH..."
    - apk add --no-cache openssh-client

    - echo "Creating SSH directory..."
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - echo "Adding private key..."
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    - echo "Adding EC2 host..."
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

  script:
    - echo "Starting K3s deployment..."

    # ==========================================
    # CREATE K8S DIRECTORY ON EC2
    # ==========================================
    - ssh "$EC2_USER@$EC2_HOST" "mkdir -p ~/k8s"

    # ==========================================
    # COPY ALL KUBERNETES YAML FILES TO EC2
    # ==========================================
    - echo "Copying Kubernetes YAML files..."
    - scp k8s/*.yml "$EC2_USER@$EC2_HOST:~/k8s/"

    # ==========================================
    # NAMESPACE
    # ==========================================
    - echo "Applying namespace..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/namespace.yml"

    # ==========================================
    # SECRETS
    # ==========================================
    - echo "Applying secrets..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/secrets.yml"
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/mongodb-secrets.yml"

    # ==========================================
    # MONGODB STORAGE
    # ==========================================
    - echo "Applying MongoDB storage..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/mongodb-pv.yml"
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/mongodb-pvc.yml"

    # ==========================================
    # MONGODB
    # ==========================================
    - echo "Deploying MongoDB..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/mongodb-deployment.yml"
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/mongodb-service.yml"

    # ==========================================
    # BACKEND
    # ==========================================
    - echo "Applying backend deployment..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/backend-deployment.yml"

    - echo "Applying backend service..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/backend-service.yml"

    # ==========================================
    # UPDATE BACKEND IMAGE
    # ==========================================
    - echo "Updating backend image..."

    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl set image deployment/backend-deployment backend=$DOCKER_USERNAME/chat-app-backend:$CI_COMMIT_SHORT_SHA -n chat-app"

    # ==========================================
    # WAIT FOR BACKEND
    # ==========================================
    - echo "Waiting for backend rollout..."

    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl rollout status deployment/backend-deployment -n chat-app --timeout=180s"

    # ==========================================
    # FRONTEND
    # ==========================================
    - echo "Applying frontend deployment..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/frontend-deployment.yml"

    - echo "Applying frontend service..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/frontend-service.yml"

    # ==========================================
    # INGRESS
    # ==========================================
    - echo "Applying ingress..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl apply -f ~/k8s/ingress.yml"

    # ==========================================
    # CHECK RESOURCES
    # ==========================================
    - echo "Checking deployments..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl get deployments -n chat-app"

    - echo "Checking pods..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl get pods -n chat-app -o wide"

    - echo "Checking services..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl get svc -n chat-app"

    - echo "Checking ingress..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl get ingress -n chat-app"

    - echo "Checking current backend image..."
    - ssh "$EC2_USER@$EC2_HOST" "sudo k3s kubectl get deployment backend-deployment -n chat-app -o jsonpath='{.spec.template.spec.containers[*].image}'"

    - echo ""
    - echo "K3s deployment completed successfully."

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'